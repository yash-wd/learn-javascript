name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 = the engines floor declared in package.json; 24 = current.
        node-version: [20, 24]
    name: verify (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Guard deploy asset list
        # The Cloudflare deploy serves the repo root, so node_modules/ MUST stay
        # excluded from upload or the build hits the 25 MiB per-asset limit
        # (workerd alone is ~119 MiB — the original deploy failure). Cheap guard
        # against anyone removing that line from .assetsignore.
        run: grep -qxF 'node_modules/' .assetsignore || { echo '::error::node_modules/ missing from .assetsignore — deploy would exceed the 25 MiB asset limit'; exit 1; }

      - name: Full repo verification
        run: bash scripts/verify.sh

  deploy:
    name: Deploy to Cloudflare
    # Only deploy real pushes to main — never on PRs — and only once the
    # verify matrix has passed, so a broken commit can't reach production.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        # Runs `wrangler deploy` using the config in wrangler.jsonc (serves the
        # repo root as static assets). Needs two repo secrets:
        #   CLOUDFLARE_API_TOKEN  — token with "Edit Cloudflare Workers" perms
        #   CLOUDFLARE_ACCOUNT_ID — your account id
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
