name: Deploy to Cloudflare

# Every push to main publishes the site to Cloudflare (Workers static assets).
# This is the "git push → live site" link. It runs AFTER code is pushed and
# deploys the repo exactly as committed (no build step — the site is static;
# .assetsignore keeps node_modules/ and dev files out of the upload).
#
# ── ONE-TIME SETUP (required to activate) ─────────────────────────────────────
# Add two repository secrets (GitHub → Settings → Secrets and variables →
# Actions → New repository secret):
#   • CLOUDFLARE_API_TOKEN  — a token with the "Workers Scripts:Edit" permission
#       (Cloudflare dashboard → My Profile → API Tokens → Create Token →
#        "Edit Cloudflare Workers" template).
#   • CLOUDFLARE_ACCOUNT_ID — Cloudflare dashboard → Workers & Pages (right side).
# Until both are set, this workflow skips deploying (it won't fail your pushes).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials are configured
        id: guard
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable auto-deploy."
          fi

      - name: Deploy with Wrangler
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
