<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Route Finder — Solution</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>🚇 Route Finder</h1>
      <p class="subtitle">
        Shortest path across a transit network — a <strong>graph</strong> (lesson 49)
        searched with <strong>BFS</strong> (lesson 50).
      </p>

      <!-- Controls -->
      <section class="controls">
        <label>
          From
          <select id="start"></select>
        </label>
        <button id="swap" class="swap" title="Swap start and destination">⇅</button>
        <label>
          To
          <select id="goal"></select>
        </label>
        <button id="find" class="find">Find route</button>
      </section>

      <!-- Result -->
      <section id="result" class="result"></section>

      <!-- Network map (the graph's edges, so you can see the structure) -->
      <section class="network">
        <h2>Network map</h2>
        <ul id="map" class="map"></ul>
      </section>
    </main>

    <!-- FINISHED SOLUTION. Open index.html to build it yourself from the starter. -->
    <script src="solution.js"></script>
  </body>
</html>
