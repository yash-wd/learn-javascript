<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual List — Solution</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>⚡ Virtual List</h1>
      <p class="subtitle">
        Scrolling <strong id="total">50,000</strong> rows while keeping only the
        visible handful in the DOM — the <strong>windowing</strong> technique
        from lesson 42.
      </p>

      <!-- Live proof it's working -->
      <p id="stats" class="stats"></p>

      <button id="jump" class="jump">Jump to a random row</button>

      <!-- The scroll viewport. Only visible rows live inside #sizer. -->
      <div id="viewport" class="viewport">
        <div id="sizer" class="sizer"></div>
      </div>
    </main>

    <!-- FINISHED SOLUTION. Open index.html to build it yourself from the starter. -->
    <script src="solution.js"></script>
  </body>
</html>
